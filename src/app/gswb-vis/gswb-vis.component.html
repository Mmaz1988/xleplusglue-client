<h3>
  Meaning constructors:
  <button type="button" (click)="structuredView = !structuredView">
    {{ structuredView ? 'Show raw text' : 'Show structured view' }}
  </button>
</h3>
<div class="editor-restr" [hidden]="structuredView">
<app-editor #edit1 [mode]="'glue'" >
</app-editor>
</div>
<app-mc-table *ngIf="structuredView" [content]="mcText" [structureJson]="mcStructureJson"></app-mc-table>

<app-gswb-settings #gswbPrefs></app-gswb-settings>
<div class="analysis-actions">
  <button (click)="calculateSemantics()">
    <span *ngIf="!loading">Calculate semantics</span>
    <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <span *ngIf="loading">Loading...</span>
  </button>
  <select [(ngModel)]="postProcessingMode" [disabled]="!canPostProcess || postProcessingLoading" aria-label="Post-processing destination">
    <option value="inline">Show below in Analysis</option>
    <option value="standalone">Open separately</option>
  </select>
  <button type="button" (click)="requestPostProcessing(postProcessingMode)" [disabled]="!canPostProcess || postProcessingLoading">
    <span *ngIf="!postProcessingLoading">Post processing</span>
    <span *ngIf="postProcessingLoading">Merging...</span>
  </button>
</div>

<div class="errorhandling" #errorhandle></div>

<h3> Semantics: </h3>
<div class="editor-restr">
<!--
  <app-editor #sem1 [mode]="'glue'">  </app-editor>
  </div>
  -->
<app-sem-vis
  #semvis
  [meaningConstructors]='meaningConstructors'
  [svgSolutions]="gswbPreferences?.gswbPreferences?.outputstyle === 5">
</app-sem-vis>
<h3>Log:</h3>
<div class="editor-restr">
  <app-editor #log1 [mode]="'glue'">  </app-editor>
</div>

<app-derivation-container #derivation>

</app-derivation-container>
<app-dialog #dialog></app-dialog>
