<h3>Graph inspector</h3>

<div class="inspector-controls">
  <input type="file" accept=".json,.pl,.prolog,.txt" (change)="onUploadFile($event)">
  <select [(ngModel)]="uploadedFormat">
    <option value="json">JSON</option>
    <option value="prolog">Prolog</option>
  </select>
  <button type="button" (click)="downloadUploadedStructure()" [disabled]="!uploadedContent.trim() || uploadedFormat !== 'json'">
    Download JSON
  </button>
</div>

<div class="inspector-controls">
  <textarea [(ngModel)]="queryText" placeholder="Enter a graph query"></textarea>
  <button type="button" (click)="runQuery()" [disabled]="queryLoading">
    <span *ngIf="!queryLoading">Run query</span>
    <span *ngIf="queryLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <span *ngIf="queryLoading">Loading...</span>
  </button>
</div>

<div class="inspector-help">
  You can prepend template and hierarchy definitions above the query, one per line.
</div>

<div class="errorhandling" #errorhandle></div>

<div class="query-result" *ngIf="queryResult">
  {{ queryResult }}
</div>

<div class="graph-results-layout">
  <div class="graph-shell">
    <app-graph-vis #cy1 [graphID]="'graph-inspector-cy'" [graphStyle]="'liger'"></app-graph-vis>
  </div>

  <aside class="solutions-panel" *ngIf="querySolutions.length">
    <div class="solutions-header">
      <h4>Solutions</h4>
      <span>{{ querySolutions.length }}</span>
    </div>

    <details #solutionCard class="solution-card" *ngFor="let solution of querySolutions; let i = index" [open]="isSolutionActive(i)" (toggle)="onSolutionToggle(i, solutionCard.open)">
      <summary>
        Solution {{ i + 1 }}
        <span class="solution-signature">{{ solution.signature }}</span>
      </summary>

      <div class="solution-variable" *ngFor="let variable of solutionEntries(solution)">
        <div class="solution-variable-name">{{ variable.variable }}</div>

        <div class="solution-node" *ngFor="let node of variable.nodes">
          <div class="solution-node-id">Node {{ node.node }}</div>
          <ul class="solution-constraints">
            <li *ngFor="let constraint of node.constraints">{{ constraint }}</li>
          </ul>
        </div>
      </div>
    </details>
  </aside>
</div>
