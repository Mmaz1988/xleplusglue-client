<h3>Vampire settings:</h3>

<form [formGroup]="vampirePreferencesForm" (ngSubmit)="onSubmit()" novalidate>
  <div>
    <label for="logic_type">Logic type:</label>
    <select formControlName="logic_type" id="logic_type" name="logic_type">
      <option value="0">first-order logic (fof)</option>
      <option value="1">typed first-order logic (tff)</option>
    </select>
  </div>

  <div>
    <label for="duration">Proof search duration:</label>
    <select formControlName="max_duration" id="duration" name="duration">
      <option value="1">1s</option>
      <option value="2">2s</option>
      <option value="3">3s</option>
      <option value="4">4s</option>
      <option value="5">5s</option>
      <option value="6">6s</option>
      <option value="7">7s</option>
      <option value="8">8s</option>
      <option value="9">9s</option>
      <option value="10">10s</option>
      <option value="15">15s</option>
      <option value="30">30s</option>
      <option value="45">45s</option>
      <option value="60">60s</option>

    </select>
  </div>

  <div>
    <label for="model-building">
      <input type="checkbox" formControlName="model_building" id="model-building" name="model-building">
      Try model building
    </label>
  </div>

  <div>
    <label for="layered">
      <input type="checkbox" formControlName="layered" id="layered" name="layered">
      Layered analysis
    </label>
  </div>

  <div *ngIf="showReadingSelection" class="reading-selection">
    <div class="reading-selection-title"
         title="Which readings of a discourse go to Vampire, unless the discourse has its own selection in its sem view: ordered by the checked criteria, the hidden readings removed, then the first k places (tied readings stay together).">
      Readings sent to Vampire ⓘ
    </div>
    <div class="reading-selection-group">
      <span [title]="orderHint">Order by:</span>
      <label *ngFor="let criterion of criteria" [title]="criterionHints[criterion]">
        <input type="checkbox" [checked]="readingSelection.criteria.includes(criterion)" (change)="toggleCriterion(criterion)">
        {{ criterionLabels[criterion] }}
      </label>
    </div>
    <div class="reading-selection-group">
      <span>Hide:</span>
      <label *ngFor="let filter of filters" [title]="filterHints[filter]">
        <input type="checkbox" [checked]="readingSelection.filters.includes(filter)" (change)="toggleFilter(filter)">
        {{ filterLabels[filter] }}
      </label>
    </div>
    <div class="reading-selection-group">
      <label for="reading-top-k" title="Places, not readings: readings tied on a place stay together.">Send:</label>
      <select id="reading-top-k" [value]="readingSelection.k === null ? 'all' : 'top'"
              (change)="setTopK($any($event.target).value === 'all' ? 'all' : '1')">
        <option value="all">all readings</option>
        <option value="top">the first k places</option>
      </select>
      <label *ngIf="readingSelection.k !== null">
        k:
        <input type="number" min="1" step="1" [value]="readingSelection.k" (change)="setTopK($any($event.target).value)">
      </label>
    </div>
  </div>

  <div *ngIf="showAnaphoraRankers" class="anaphora-rankers">
    <app-anaphora-ranker-settings
      [rankers]="vampirePreferencesForm.value.anaphora_rankers"
      [averager]="vampirePreferencesForm.value.anaphora_averager"
      (selectionChange)="onRankerSelectionChange($event)"></app-anaphora-ranker-settings>
  </div>
</form>
