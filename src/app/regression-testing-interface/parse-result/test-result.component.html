<div class="test-result-block" [ngClass]="{
      'highlight-block': noOfSolutions === 0,
      'multi-selected': selectedSolutionIds.length > 1
    }">
  <span *ngIf="displayIndex !== null" class="index-badge">{{ displayIndex }}</span>

  <div class="sentence-line">{{sentence_id}}: {{sentence}}</div>
  <div>
    Number of applied rules:
    <span [ngClass]="{ 'zero-value': numberOfAppliedRules === 0 }">
      {{numberOfAppliedRules}}
    </span>
  </div>

  <div>
    Number of meaning constructor sets:
    <span [ngClass]="{ 'zero-value': numberOfMCsets === 0 }">
      {{numberOfMCsets}}
    </span>
  </div>

  <div>
    Number of solutions:
    <span [ngClass]="{ 'zero-value': noOfSolutions === 0 }">
      {{noOfSolutions}}
    </span>
  </div>

  <div>
    Number of selected solutions:
    <span [ngClass]="{ 'zero-value': selectedSolutionIds.length === 0 }">
      {{ selectedSolutionIds.length }} / {{ noOfSolutions }}
    </span>
  </div>

  <button type="button" (click)="openSolutionsDialog(0)">
    Open solutions
  </button>
</div>
