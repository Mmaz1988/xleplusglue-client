<div class="frame">

  <div class="container">
    <h1>Semantic parser settings</h1>
    <app-toggle-display #toggleDisplayComponent type="fileTree" showText="Show settings" hideText="Hide settings">
      <div class="grammar-loader-container">
        <div>
          <h2>Grammar selection:</h2>
          <app-grammar-loader></app-grammar-loader>
        </div>
        <div>
        <h2>Test suite selection:</h2>
        <app-rule-loader (dataEmitter)="updateData($event)"></app-rule-loader>
      </div>
        <div>
          <h2>Rule file selection:</h2>
          <app-rule-loader (dataEmitter)="updateData($event)"></app-rule-loader>
        </div>
        <div>
        <h2>Default axioms selection:</h2>
        <app-rule-loader (dataEmitter)="updateData($event)"></app-rule-loader>
      </div>
      </div>
      <app-gswb-settings #gswbSettings></app-gswb-settings>
      <app-inference-settings  #vampirePrefs></app-inference-settings>
      <div class="pruning-container">
        <input type="checkbox" #contextPruning id="contextPruning" />
        <label for="contextPruning">Pruning</label>
      </div>
    </app-toggle-display>
  </div>
<h3>
  Testsuite:
</h3>

  <div class="editor-restr">
<app-editor #testsuite [mode]="'text'"> </app-editor>
  </div>
  <br>


  <!--
  <div>
    <div class="result-container" *ngFor="let element of regressionTestItems; let i = index">
      <app-test-item [data]="element" [sentenceMap]="this.sentenceMap" >
      </app-test-item>
    </div>
  </div>
  <br>
  <button (click)="parse_testfile(testsuite.getContent())">parse testfile</button>
-->

  <app-toggle-display type="liger" showText="Show input rules" hideText="Hide input rules">
<h3>
  Test rules:
</h3>
    <div class="gradient-container">
    <div class="editor-restr">

  <app-editor #ligerRules [mode]="'liger'"> </app-editor>
</div>
      <div class="bar-container">
        <div class="gradient-bar"></div>
        <div class="empty-space"></div>
      </div>
    </div>

</app-toggle-display>

  <app-toggle-display type="liger" showText="Show default axioms" hideText="Hide default axioms">
    Axioms:
    <div class="editor-restr">
      <app-editor #axiomEdit [mode]="'vampire'">
      </app-editor>
    </div>
  </app-toggle-display>




<button (click)="batchParse(testsuite.getContent(), ligerRules.getContent())">
  <span *ngIf="!loading">Parse all</span>
  <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
  <span *ngIf="loading">Loading...</span>
</button>
  <button class="button beta" (click)="batchMultistage(testsuite.getContent())">
    <span *ngIf="!loading">Multistage</span>
    <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <span *ngIf="loading">Loading...</span>
  </button>

  <div class="errorhandling" #errorhandle></div>

<h3>
  Parsing report:
</h3>
  <app-toggle-display type="liger" showText="Show parsing results" hideText="Hide parsing results">
  <div>
    <div class="result-container" *ngFor="let element of regressionTestResults; let i = index">
      <app-test-result [data]="element" >
      </app-test-result>
    </div>
  </div>
  </app-toggle-display>
  <br>
  <br>
  <h3>
    Inference report:
  </h3>
  <app-toggle-display type="liger" showText="Show parsing results" hideText="Hide parsing results">
    <div>
      <div class="result-container" *ngFor="let element of inferenceResults; let i = index">
        <app-inference-result [data]="element" >
        </app-inference-result>
      </div>
    </div>
  </app-toggle-display>
  <br>
  <br>
<pre>
{{this.inferenceSummary}}</pre>
  <app-toggle-display type="liger" showText="Show applied rules" hideText="Hide applied rules">
<h3>
  Applied rules:
</h3>

<div>
<app-applied-rules-graph #arcy [graphID]="'arCy1'"></app-applied-rules-graph>
</div>
  </app-toggle-display>
</div>
