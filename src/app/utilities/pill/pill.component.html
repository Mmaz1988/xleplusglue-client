<div class="pill-anchor"
     cdkOverlayOrigin
     #origin="cdkOverlayOrigin"
     [style.--pill-min-color]="minimizedColor">

  <div class="pill-badge-btn" (click)="toggle()">
    <span class="pill-badge">{{ badge }}</span>
  </div>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open"
  [cdkConnectedOverlayHasBackdrop]="true"
  (backdropClick)="open = false"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayFlexibleDimensions]="true"
  [cdkConnectedOverlayGrowAfterOpen]="false"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8">

  <div class="pill-panel" (click)="$event.stopPropagation()">
    <button class="pill-close" type="button" (click)="close($event)" aria-label="Close">
      &times;
    </button>

    <ng-container [ngSwitch]="variant">
      <div *ngSwitchCase="'glyph-grid'" class="glyph-grid"
           [style.gridTemplateColumns]="'repeat(' + gridSize + ', 1fr)'">
        <div class="glyph-cell" *ngFor="let g of glyphs; trackBy: trackByIdx" [innerHTML]="g"></div>
      </div>

      <div *ngSwitchCase="'text'" class="detail-body">
        <pre> {{ text }} </pre>
      </div>

      <div *ngSwitchCase="'editor'" class="editor-body">
        <div class="editor-restr">
        <app-editor #glue [mode]="'glue'">  </app-editor>
        </div>
      </div>

      <!-- Lives inside the overlay template on purpose: it is only instantiated while the
           pill is open, and app-sem-vis renders one solution at a time, so a long branch
           list costs a single SVG render. -->
      <div *ngSwitchCase="'sem-vis'" class="sem-vis-body">
        <app-sem-vis [items]="items" [itemLabels]="itemLabels" [svgSolutions]="true"></app-sem-vis>
      </div>

    </ng-container>
  </div>
</ng-template>
