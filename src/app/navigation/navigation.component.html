<div class="navigation"
     [class.expanded]="isNavigationVisible"
     (mouseenter)="showNavigation()"
     (mouseleave)="hideNavigation()">
  <span class="parser-toggle-label" [title]="toggleTitle">UD:</span>
  <label class="switch" [class.disabled]="toggleDisabled" [title]="toggleTitle">
    <input #udToggle type="checkbox" class="ud-toggle" [checked]="syntaxSource.isUd" [disabled]="toggleDisabled"
           (change)="onToggle(udToggle)">
    <span class="slider"></span>
  </label>
  <div class="parser-notice" *ngIf="isNavigationVisible && notice">{{ notice }}</div>

  <div class="navigation-content" *ngIf="isNavigationVisible">
    <ul>
      <!-- Navigation items -->
      <li class="has-submenu">
        <a routerLink="/demo">Analysis</a>
        <ul class="submenu">
          <li><a routerLink="/glue">GSWB</a></li>
          <li><a routerLink="/liger">LiGER</a></li>
          <li><a routerLink="/graph-inspector">Post processing</a></li>
        </ul>
      </li>
      <li><a routerLink="/regression-dashboard">Inference banks</a></li>
      <li><a routerLink="/regression">Regression testing</a></li>
      <!-- <li><a routerLink="/inference">Inference</a></li> deactivated for demo -->
      <li><a routerLink="/chat">Chat</a></li>
      <li><a routerLink="/home">Home</a></li>
    </ul>
  </div>
</div>
<div class="page-content">
  <router-outlet></router-outlet>
  <!-- The router-outlet will display the content of the active route -->
</div>
