<div class="container">
<h1>Semantic parser settings</h1>
  <app-toggle-display #toggleDisplayComponent type="fileTree" showText="Show settings" hideText="Hide settings">
<div class="grammar-loader-container">
  <div>
    <h2>Grammar selection:</h2>
  <app-grammar-loader></app-grammar-loader>
  </div>
  <div>
    <h2>LiGER config selection:</h2>
    <app-liger-config-loader></app-liger-config-loader>
  </div>
</div>
 <app-gswb-settings #gswbPrefs></app-gswb-settings>
 <app-inference-settings  #vampirePrefs [showAnaphoraRankers]="true"></app-inference-settings>
</app-toggle-display>
</div>

<mat-tab-group *ngIf="tabsInitialized">
  <mat-tab label="Chat">
    <div class="tab-content">
      <app-hover-sidebar label="Chat options">
        <button type="button" (click)="startNewConversation()">New conversation</button>
        <button type="button" (click)="downloadChatDocumentSnapshot()">Download JSON snapshot</button>
        <div class="session-id-row" title="Chat session id -- matches tmp/log file names on the inference backend">{{ chatDocumentSessionKey }}</div>
      </app-hover-sidebar>
      <!-- Rules and axioms come from the LiGER workspace (the Config tab), edits included. -->
      <app-chat #chat [ruleString]="(workspace.semantics$ | async) ?? ''"
                [pragmaticsRuleString]="workspace.pragmatics$ | async"
                [axioms]="(workspace.axioms$ | async) ?? ''"
                [gswbPreferences]="gswbPrefs"
                [vampirePreferences]="vampirePrefs"
                [history]="history" (historyChange)="updateHistory($event)"
                [activeIndices]="selectedElements"
                [chatDocument]="chatDocument" (chatDocumentChange)="updateChatDocument($event)"
                [sessionKey]="chatDocumentSessionKey"
                (clearSelection)="onClearSelection()"
                (derivedAxiomsChange)="derivedAxioms = $event">
        ></app-chat>
    </div>
  </mat-tab>

  <mat-tab label="History">
    <div class="tab-content">
      <!-- Placeholder for history component -->
     <app-history [history] = "history" (selectionChanged)="onSelectionChanged($event)"> </app-history>
    </div>
  </mat-tab>

  <!-- The rule set chat runs on: semantics and pragmatics rules, lexica and axioms, one
       workspace shared with the analysis page. -->
  <mat-tab label="Config">
    <div class="tab-content config-tab">
      <app-liger-workspace preferField="axioms" [treeOpen]="true" height="600px"></app-liger-workspace>

      <h3>Axioms from this conversation</h3>
      <p class="derived-help">
        Axioms GSWB returned with the readings so far. Sent to Vampire after the rule set's
        axioms; cleared by "New conversation".
      </p>
      <pre class="derived-axioms" *ngIf="derivedAxioms.trim(); else noDerivedAxioms">{{ derivedAxioms }}</pre>
      <ng-template #noDerivedAxioms><p class="derived-help">None yet.</p></ng-template>
    </div>
  </mat-tab>
</mat-tab-group>
