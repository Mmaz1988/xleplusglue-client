<!-- Pruning Checkbox Above Chat Window -->
<div class="pruning-container">
  <input type="checkbox" #contextPruning id="contextPruning" />
  <label for="contextPruning">Pruning</label>
</div>

<div class="chat-container">
  <!-- Chat History -->
  <div class="chat-history">
    <div *ngFor="let message of chatHistory" [ngClass]="{'user-message': message.sender === 'User', 'bot-message': message.sender === 'Bot'}" class="message-container">
      <span class="message-sender">{{ message.sender }}:</span>
      <pre class="message-text">{{ message.text }}</pre>


      <div class="pill-container">
        <!-- Glyph Container -->
        <div *ngIf="message.glyphs?.length"
             class="message-glyph"
             [ngClass]="{ 'minimized': !message.showGlyph }"
             (click)="toggleGlyphVisibility(message)">

          <ng-container *ngIf="message.showGlyph; else collapsed">
            <!-- close button -->
            <button class="pill-close"
                    type="button"
                    (click)="closeGlyph(message,$event)"
                    aria-label="Close">
              ×
            </button>
            <div class="glyph-grid"
                 [style.gridTemplateColumns]="'repeat(' + message.glyphGridSize + ', 1fr)'">
              <div class="glyph-cell"
                   *ngFor="let g of message.glyphs"
                   [innerHTML]="sanitizeSvg(g)">
              </div>
            </div>
          </ng-container>

          <ng-template #collapsed>
            <div>V</div>
          </ng-template>

        </div>


      <!-- Detail Container (text-based glyph) -->
      <div *ngIf="message.detailText"
           class="message-detail"
           [ngClass]="{'minimized': !message.showDetail}"
           (click)="toggleDetailVisibility(message)">
        <ng-container *ngIf="message.showDetail" (click)="toggleDetailVisibility(message)">
          <!-- Use <pre> for preserved formatting; or a <div> if you want normal wrapping -->
          <div>{{ message.detailText }}</div>
        </ng-container>
        <ng-container *ngIf="!message.showDetail">
          <div>TPTP</div>
        </ng-container>
      </div>
    </div>
    </div>


    <!-- LOADING INDICATOR (Shows while waiting for response) -->
    <div *ngIf="loading" class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Chat Input -->
  <div class="chat-input">
    <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..." />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
