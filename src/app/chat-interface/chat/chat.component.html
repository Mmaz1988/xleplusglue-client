<!-- Pruning Checkbox Above Chat Window -->
<div class="pruning-container">
  <input type="checkbox" #contextPruning id="contextPruning" />
  <label for="contextPruning">Pruning</label>
</div>

<div class="chat-container">
  <!-- Chat History -->
  <div class="chat-history">
    <div *ngFor="let message of chatHistory" [ngClass]="{'user-message': message.sender === 'User', 'bot-message': message.sender === 'Bot'}" class="message-container">
      <span class="message-sender">{{ message.sender }}:</span>
      <pre class="message-text">{{ message.text }}</pre>


      <div class="pill-container">
        <div class="pill-container">
          <!-- SVG glyph grid pill -->
          <app-pill
            *ngIf="message.glyphs?.length"
            badge="V"
            variant="glyph-grid"
            [glyphs]="message.safeGlyphs"
            [gridSize]="message.glyphGridSize"
            [minimizedColor]="'#2e7d32'">
          </app-pill>

          <!-- Text pill -->
          <app-pill
            *ngIf="message.semanticText"
            badge="DRS"
            variant="text"
            [text]="message.semanticText"
            [minimizedColor]="'#6a1b9a'"
            [closeOnly]="true">
          </app-pill>

          <app-pill
            *ngIf="message.detailText"
            badge="TPTP"
            variant="text"
            [text]="message.detailText"
            [minimizedColor]="'#1565c0'"
            [closeOnly]="true">
          </app-pill>
        </div>
    </div>
    </div>


    <!-- LOADING INDICATOR (Shows while waiting for response) -->
    <div *ngIf="loading" class="loading-container">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Chat Input -->
  <div class="chat-input">
    <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" placeholder="Type your message..." />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
